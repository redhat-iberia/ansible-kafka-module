DOCUMENTATION:
  name: to_avro
  version_added: "1.0.0"
  short_description: Convert Python objects to Avro binary format
  description:
    - This filter plugin provides conversion between Python objects and Avro binary format
    - Includes to_avro filter for encoding and from_avro filter for decoding
    - Uses fastavro library for high-performance Avro operations
  author: Red Hat Iberia
  options:
    _input:
      description: The input value to convert
      type: raw
      required: true
    schema:
      description: Avro schema definition as a string
      type: str
      required: true

EXAMPLES: |
  # Convert a Python dict to Avro binary
  - name: Convert user data to Avro
    DOCUMENTATION:
      name: to_avro
      version_added: "1.0.0"
      short_description: Convert Python objects to Avro binary format
      description:
        - This filter plugin provides conversion between Python objects and Avro binary format
        - Implements the `to_avro` filter for encoding (paired with `message_from_avro` for decoding)
        - Uses the `fastavro` library for high-performance Avro operations
      author: Red Hat Iberia
      options:
        _input:
          description: The input value to convert
          type: raw
          required: true
        schema:
          description: Avro schema definition as a dict or JSON string
          type: raw
          required: true

    EXAMPLES: |
      # Convert a Python dict to Avro binary
      - name: Convert user data to Avro
        vars:
          user_schema:
            type: "record"
            name: "User"
            fields:
              - name: "name"
                type: "string"
              - name: "age"
                type: "int"
          user_data:
            name: "John Doe"
            age: 30
        set_fact:
          avro_binary: "{{ user_data | to_avro(user_schema) }}"

      # Convert Avro binary back to Python object using the message_from_avro filter
      - name: Decode Avro data
        set_fact:
          decoded_data: "{{ avro_binary | message_from_avro(user_schema) }}"

    RETURN:
      _value:
        description: The converted data
        type: raw
        fields:
